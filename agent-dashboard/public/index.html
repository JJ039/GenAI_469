<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Bank Agent Dashboard</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f5f5f5; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
    h1 { color: #333; }
    .controls { margin: 20px 0; padding: 15px; background: #e3f2fd; border-radius: 8px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #1976d2; color: white; border: none; border-radius: 4px; }
    button:hover { background: #1565c0; }
    .status { padding: 10px; background: #fce4ec; border: 1px solid #f57c00; border-radius: 4px; margin: 10px 0; }
    .stage { padding: 10px; background: #e8f5e9; border: 1px solid #4caf50; border-radius: 4px; margin: 8px 0; }
    .score { font-size: 24px; font-weight: bold; color: #4caf50; }
    .score.fail { color: #f44336; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/static/js/bundle.js"></script>
</body>
</html>
